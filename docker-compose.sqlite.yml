# Compatibility alias for the default SQLite Compose deployment.
services:
  app:
    build:
      context: .
      args:
        DATABASE_PROVIDER: sqlite
    ports:
      - "3013:3013"
    env_file:
      - .env
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/app/data/forge.db
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Generate a strong NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3013}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3013}
    volumes:
      - sqlite_data:/app/data
      - uploads:/app/public/images/uploads
      - private_uploads:/app/private/chat-uploads
    restart: unless-stopped

volumes:
  sqlite_data:
  uploads:
  private_uploads:
